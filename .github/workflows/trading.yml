# Les 6 IA de l'équipe (avec les fonctions des IA d'Aywen) travaillent automatiquement chaque jour de bourse :
#   - 9 h (Paris)        PRÉPARATION : l'équipe décide quoi acheter, ordres planifiés pour l'ouverture
#   - 15 h 30 (Paris)    OUVERTURE   : le programme exécute les ordres planifiés dès l'ouverture de New York
#   - fin d'après-midi   SUIVI       : bourse ouverte, l'équipe fait le point et agit en direct
# Des déclenchements de secours rattrapent un horaire oublié par GitHub (sans jamais doubler une séance).
# La mémoire (notes, registre du compte, plan) est recommitée, puis le tableau de bord est publié :
#   - dépôt PUBLIC  -> branche gh-pages, servie par GitHub Pages (« Deploy from a branch » : gh-pages, racine)
#   - dépôt PRIVÉ   -> Cloudflare Pages (variable CLOUDFLARE_PROJECT + secrets, voir le README)
name: Bot IA trading

on:
  schedule:
    # Heures UTC, du lundi au vendredi. GitHub peut retarder un déclenchement, voire le sauter quand il
    # est surchargé (surtout aux heures pile) : on évite la minute 0 et chaque séance a des rattrapages.
    # Une séance déjà faite n'est jamais refaite (le programme vérifie le plan et les séances du jour).
    - cron: "7 7 * * 1-5"    # préparation : 9 h 07 à Paris en heure d'été (en hiver il est 8 h 07 : ignoré)
    - cron: "7 8 * * 1-5"    # préparation : 9 h 07 à Paris en heure d'hiver (en été : rattrapage de 10 h 07)
    - cron: "37 8 * * 1-5"   # préparation : rattrapage
    - cron: "17 9 * * 1-5"   # préparation : rattrapage (au plus tard 12 h à Paris)
    - cron: "20 13 * * 1-5"  # ouverture : attend l'ouverture de New York (13 h 30 ou 14 h 30 UTC)
    - cron: "47 14 * * 1-5"  # ouverture : rattrapage si le déclenchement précédent a été perdu
    - cron: "23 15 * * 1-5"  # ouverture : rattrapage
    - cron: "30 17 * * 1-5"  # suivi : 19 h 30 à Paris en été, 18 h 30 en hiver
    - cron: "13 18 * * 1-5"  # suivi : rattrapage
    - cron: "52 18 * * 1-5"  # suivi : rattrapage (la bourse ferme à 20 h ou 21 h UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: "Séance à lancer (auto = préparation si la bourse est fermée, suivi si elle est ouverte ; verification = tester l installation)"
        type: choice
        options: [auto, preparation, suivi, ouverture, verification]
        default: auto
      dry_run:
        description: "Simulation (aucun ordre envoyé, rien d'enregistré)"
        type: boolean
        default: true
      force:
        description: "Forcer (ignorer l'horaire et les séances déjà faites) ; décoché pour un déclencheur externe"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: trading
  cancel-in-progress: false

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      # La DERNIÈRE version de la branche (et non celle du déclenchement) : une séance mise en attente
      # derrière une autre repart ainsi de la mémoire que celle-ci vient d'enregistrer (plan déjà exécuté…).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Séance des IA
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ inputs.mode }}
          FORCE: ${{ inputs.force }}
        run: |
          case "$SCHEDULE" in
            "7 7 * * 1-5"|"7 8 * * 1-5"|"37 8 * * 1-5"|"17 9 * * 1-5") MODE=preparation ;;
            "20 13 * * 1-5"|"47 14 * * 1-5"|"23 15 * * 1-5") MODE=ouverture ;;
            "30 17 * * 1-5"|"13 18 * * 1-5"|"52 18 * * 1-5") MODE=suivi ;;
            *) MODE="${MANUAL_MODE:-auto}" ;;
          esac
          ARGS="--mode $MODE"
          if [ "$MODE" = "verification" ]; then ARGS="--verifier"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$FORCE" != "false" ]; then ARGS="$ARGS --force"; fi
          echo "Séance : $ARGS"
          python main.py $ARGS

      - name: Sauvegarder la mémoire des IA
        if: always()
        run: |
          git config user.name "bot-ia-trading"
          git config user.email "bot-ia-trading@users.noreply.github.com"
          git add memoire/
          if git diff --cached --quiet; then
            echo "Rien à sauvegarder."
          else
            git commit -m "Mémoire : séance du $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi

      - name: Construire le tableau de bord en ligne
        if: always()
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
        run: python build_site.py

      - name: Publier dans la branche gh-pages (GitHub Pages)
        if: ${{ always() && !github.event.repository.private && vars.CLOUDFLARE_PROJECT == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/publier-gh-pages.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site
          path: site
          include-hidden-files: true
          retention-days: 3

  # Dépôt privé : publication sur Cloudflare Pages (gratuit)
  cloudflare:
    needs: session
    if: ${{ always() && vars.CLOUDFLARE_PROJECT != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - name: Publier sur Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT }}
        run: |
          npx --yes wrangler@3 pages project create "$PROJECT" --production-branch=main || true
          npx --yes wrangler@3 pages deploy site --project-name="$PROJECT" --branch=main
