# Les 4 IA (comme dans la vidéo d'Aywen) travaillent automatiquement chaque jour de bourse :
#   - 9 h (Paris)        PRÉPARATION : elles décident quoi acheter, ordres planifiés pour l'ouverture
#   - 15 h 30 (Paris)    OUVERTURE   : le programme exécute les ordres planifiés dès l'ouverture de New York
#   - fin d'après-midi   SUIVI       : bourse ouverte, elles font le point et agissent en direct
# La mémoire (notes, sous-comptes, plan) est recommitée, puis le tableau de bord est publié :
#   - dépôt PUBLIC  -> GitHub Pages (Settings > Pages > Source : « GitHub Actions »)
#   - dépôt PRIVÉ   -> Cloudflare Pages (variable CLOUDFLARE_PROJECT + secrets, voir le README)
name: Bot IA trading

on:
  schedule:
    # Heures UTC, du lundi au vendredi (GitHub peut retarder un déclenchement de quelques minutes).
    - cron: "0 7 * * 1-5"    # préparation : 9 h à Paris en heure d'été (en hiver il est 8 h : ignoré)
    - cron: "0 8 * * 1-5"    # préparation : 9 h à Paris en heure d'hiver (en été il est 10 h : déjà fait)
    - cron: "20 13 * * 1-5"  # ouverture : attend l'ouverture de New York (13 h 30 ou 14 h 30 UTC)
    - cron: "45 14 * * 1-5"  # ouverture : secours si le déclenchement précédent a été perdu
    - cron: "30 17 * * 1-5"  # suivi : 19 h 30 à Paris en été, 18 h 30 en hiver
  workflow_dispatch:
    inputs:
      mode:
        description: "Séance à lancer"
        type: choice
        options: [preparation, suivi, ouverture]
        default: preparation
      dry_run:
        description: "Simulation (aucun ordre envoyé, rien d'enregistré)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: trading
  cancel-in-progress: false

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Séance des IA
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          case "$SCHEDULE" in
            "0 7 * * 1-5"|"0 8 * * 1-5") MODE=preparation ;;
            "20 13 * * 1-5"|"45 14 * * 1-5") MODE=ouverture ;;
            "30 17 * * 1-5") MODE=suivi ;;
            *) MODE="${MANUAL_MODE:-preparation}" ;;
          esac
          ARGS="--mode $MODE"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then ARGS="$ARGS --force"; fi
          echo "Séance : $ARGS"
          python main.py $ARGS

      - name: Sauvegarder la mémoire des IA
        if: always()
        run: |
          git config user.name "bot-ia-trading"
          git config user.email "bot-ia-trading@users.noreply.github.com"
          git add memoire/
          if git diff --cached --quiet; then
            echo "Rien à sauvegarder."
          else
            git commit -m "Mémoire : séance du $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi

      - name: Construire le tableau de bord en ligne
        if: always()
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
        run: python build_site.py

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site
          path: site
          include-hidden-files: true
          retention-days: 3

  # Dépôt public : publication sur GitHub Pages
  pages:
    needs: session
    if: ${{ always() && !github.event.repository.private && vars.CLOUDFLARE_PROJECT == '' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Dépôt privé : publication sur Cloudflare Pages (gratuit)
  cloudflare:
    needs: session
    if: ${{ always() && vars.CLOUDFLARE_PROJECT != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - name: Publier sur Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT }}
        run: |
          npx --yes wrangler@3 pages project create "$PROJECT" --production-branch=main || true
          npx --yes wrangler@3 pages deploy site --project-name="$PROJECT" --branch=main
