# Republie le tableau de bord en ligne dès qu'une modification de l'interface est envoyée sur
# GitHub (sans lancer les IA). Les séances des IA, elles, publient le site après chaque séance.
name: Publier le site

on:
  push:
    branches: [main]
    paths: ["dashboard/**", "dashboard.py", "build_site.py", "bot/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Construire le tableau de bord en ligne
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
        run: python build_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Dépôt public : publication sur GitHub Pages
  pages:
    needs: build
    if: ${{ !github.event.repository.private && vars.CLOUDFLARE_PROJECT == '' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
