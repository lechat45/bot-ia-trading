# Republie le tableau de bord en ligne dès qu'une modification de l'interface est envoyée sur
# GitHub (sans lancer les IA). Les séances des IA, elles, publient le site après chaque séance.
name: Publier le site

on:
  push:
    branches: [main]
    paths: ["dashboard/**", "dashboard.py", "build_site.py", "bot/**", ".github/workflows/site.yml", ".github/publier-gh-pages.sh"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Construire le tableau de bord en ligne
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
        run: python build_site.py

      - name: Publier dans la branche gh-pages (GitHub Pages)
        if: ${{ !github.event.repository.private && vars.CLOUDFLARE_PROJECT == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/publier-gh-pages.sh
